<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Mi Plata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="wrap auth-header-inner">
            <a href="index.html" class="logo">Mi Plata</a>
            <p class="auth-header-link">¿No tienes cuenta? <a href="registro.html" class="link-quiet">Crear cuenta</a>
            </p>
        </div>
    </header>

    <main class="auth-shell">
        <div class="auth-card">
            <h1>Inicia sesión</h1>
            <p class="auth-sub">Ingresa con tu usuario y contraseña para ver tus productos.</p>

            <!-- El mensaje de error/bloqueo se muestra/oculta con JS según el resultado de la validación -->
            <div class="form-message form-message-error" id="login-message" hidden>
                Usuario o contraseña incorrectos.
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-input" autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-input"
                        autocomplete="current-password" required>
                </div>

                <!-- Contador de intentos: visible desde el primer fallo -->
                <p class="attempts-indicator" id="attempts-indicator" hidden>
                    Intentos fallidos: <span id="attempts-count">0</span> de 3
                </p>

                <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
            </form>

            <p class="auth-footer-link">
                <a href="index.html" class="link-quiet">Volver al inicio</a>
            </p>
        </div>
    </main>
    <script type="module" src="src/login.js"></script>
</body>

</html>
